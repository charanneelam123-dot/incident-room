[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-room"
version = "0.1.0"
description = "Investigate a simulated outage with tools, evidence, and approval-gated sandbox fixes."
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.scripts]
incident-room = "incident_room.cli:main"

[tool.setuptools.packages.find]
include = ["incident_room*"]

[tool.setuptools.package-data]
incident_room = ["data/*.json", "data/*.md", "web/*"]
